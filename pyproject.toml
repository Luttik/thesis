[tool.poetry]
name = "thesis"
version = "0.1.0"
description = "Thesis project scripts (e.g. transcript chunking and cleaning)"
readme = "README.md"
authors = []
packages = []

[tool.poetry.dependencies]
python = "^3.12"

[tool.poetry.group.dev.dependencies]
ruff = "^0.8"
pytest = "^8"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
