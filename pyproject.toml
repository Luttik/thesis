[tool.poetry]
name = "thesis"
version = "0.1.0"
description = "Thesis project scripts (e.g. transcript chunking and cleaning)"
readme = "README.md"
authors = []
packages = [{ include = "thesis_cli" }]

[tool.poetry.scripts]
qdpx-dedupe = "thesis_cli.cli:qdpx_dedupe"
qdpx-dedupe-launch = "thesis_cli.cli:qdpx_dedupe_launch"
qdpx-code-search = "thesis_cli.cli:qdpx_code_search"
qdpx-code-search-test = "thesis_cli.cli:qdpx_code_search_test"
qdpx-dedupe-apply = "thesis_cli.cli:qdpx_dedupe_apply"
qdpx-initial-review = "thesis_cli.cli:qdpx_initial_review"
qdpx-category-suggest = "thesis_cli.cli:qdpx_category_suggest"
qdpx-paragraph-vast = "thesis_cli.cli:qdpx_paragraph_vast"
tools = "thesis_cli.cli:tools_menu"
dedupe = "thesis_cli.cli:dedupe"
dedupe-launch = "thesis_cli.cli:dedupe_launch"
code-search = "thesis_cli.cli:code_search"
code-search-test = "thesis_cli.cli:code_search_test"
dedupe-apply = "thesis_cli.cli:dedupe_apply"
initial-review = "thesis_cli.cli:initial_review"
category-suggest = "thesis_cli.cli:category_suggest"
paragraph-vast = "thesis_cli.cli:paragraph_vast"

[tool.poetry.dependencies]
python = "^3.12"
typer = "^0.24.1"
python-docx = "^1.2.0"
numpy = "^2.3.0"
sentence-transformers = "^3.0.1"
textual = "^0.79.1"

[tool.poetry.group.dev.dependencies]
ruff = "^0.8"
pytest = "^8"
matplotlib = "^3.10.9"
cairosvg = "^2.9.0"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".cursor"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
