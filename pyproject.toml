[tool.poetry]
name = "thesis"
version = "0.1.0"
description = "Thesis project scripts (e.g. transcript chunking and cleaning)"
readme = "README.md"
authors = []
packages = [{ include = "thesis_cli" }]

[tool.poetry.scripts]
qdpx-dedupe = "thesis_cli.cli:qdpx_dedupe"
qdpx-dedupe-launch = "thesis_cli.cli:qdpx_dedupe_launch"

[tool.poetry.dependencies]
python = "^3.12"
typer = "^0.24.1"
python-docx = "^1.2.0"
numpy = "^2.3.0"
sentence-transformers = "^3.0.1"
textual = "^0.79.1"

[tool.poetry.group.dev.dependencies]
ruff = "^0.8"
pytest = "^8"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".cursor"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
